<section class="relative py-20 px-6 w-full overflow-hidden border-t border-regal-purple/10">

    <div class="absolute bottom-0 right-1/4 w-80 h-80 bg-cyber-cyan/5 blur-[120px] rounded-full pointer-events-none">
    </div>
    <div class="absolute top-10 left-1/4 w-80 h-80 bg-regal-purple/5 blur-[120px] rounded-full pointer-events-none">
    </div>

    <div class="container mx-auto max-w-4xl relative z-10">

        <div class="text-center mb-12">
            <h2 class="text-3xl md:text-5xl font-extrabold text-text-main mb-4">
                {{ 'contact.title1' | translate }}
                <span class="bg-gradient-to-r from-regal-purple to-cyber-cyan bg-clip-text text-transparent">
                    {{ 'contact.title2' | translate }}
                </span>
            </h2>
            <p class="text-text-dim text-sm md:text-base max-w-lg mx-auto leading-relaxed">
                {{ 'contact.subtitle' | translate }}
            </p>
        </div>

        <div
            class="bg-surface/30 backdrop-blur-md border border-regal-purple/10 p-6 md:p-10 rounded-2xl max-w-2xl mx-auto shadow-2xl relative z-20">

            <form action="https://formspree.io/f/mojzzzgg" method="POST" class="space-y-6">
                <div>
                    <label class="block text-text-main text-sm font-bold mb-2">
                        Full Name
                    </label>
                    <input type="text" name="name" required
                        class="w-full px-4 py-3 bg-surface/50 border border-regal-purple/20 rounded-xl text-text-main focus:outline-none focus:border-cyber-cyan transition-colors">
                </div>

                <div>
                    <label class="block text-text-main text-sm font-bold mb-2">
                        Email Address
                    </label>
                    <input type="email" name="email" required
                        class="w-full px-4 py-3 bg-surface/50 border border-regal-purple/20 rounded-xl text-text-main focus:outline-none focus:border-cyber-cyan transition-colors">
                </div>

                <div>
                    <label class="block text-text-main text-sm font-bold mb-2">
                        Your Message
                    </label>
                    <textarea name="message" rows="5" required
                        class="w-full px-4 py-3 bg-surface/50 border border-regal-purple/20 rounded-xl text-text-main focus:outline-none focus:border-cyber-cyan transition-colors"></textarea>
                </div>

                <button type="submit"
                    class="w-full py-4 bg-gradient-to-r from-regal-purple to-cyber-cyan rounded-xl text-white font-bold text-lg transition-all duration-300 hover:scale-[1.02] hover:shadow-[0_0_25px_rgba(0,209,255,0.4)] cursor-pointer">
                    Send Message
                </button>
            </form>

        </div>
        <footer
            class="mt-24 pt-8 border-t border-regal-purple/5 flex flex-col md:flex-row items-center justify-between gap-6">
            <div
                class="text-xl font-black bg-gradient-to-r from-regal-purple to-cyber-cyan bg-clip-text text-transparent tracking-wider">
                RANIA.DEV
            </div>

            <p class="text-text-dim text-xs md:text-sm order-3 md:order-2">
                {{ 'contact.rights' | translate }}
            </p>

            <div class="flex items-center gap-5 order-2 md:order-3">
                <a href="https://mostaql.com/u/RaniaMaNsour/portfolio" target="_blank"
                    class="text-text-dim hover:text-cyber-cyan transition-colors text-sm font-medium">
                    مستقل
                </a>
                <a href="https://github.com/rania-ibrhem30" target="_blank"
                    class="text-text-dim hover:text-regal-purple transition-colors text-sm font-medium">
                    GitHub
                </a>
                <a href="https://www.linkedin.com/in/rania-ibrahem-ba54a6396/" target="_blank"
                    class="text-text-dim hover:text-cyber-cyan transition-colors text-sm font-medium">
                    LinkedIn
                </a>
            </div>
        </footer>

    </div>
</section>

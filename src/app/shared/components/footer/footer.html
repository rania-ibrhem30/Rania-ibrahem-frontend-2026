<section class="relative py-20 px-6 w-full overflow-hidden border-t border-regal-purple/10">
    <!-- تأثيرات الإضاءة النيون في الخلفية -->
    <div class="absolute bottom-0 right-1/4 w-80 h-80 bg-cyber-cyan/5 blur-[120px] rounded-full"></div>
    <div class="absolute top-10 left-1/4 w-80 h-80 bg-regal-purple/5 blur-[120px] rounded-full"></div>

    <div class="container mx-auto max-w-4xl relative z-10">

        <!-- العنوان -->
        <div class="text-center mb-12">
            <h2 class="text-3xl md:text-5xl font-extrabold text-text-main mb-4">
                {{ 'contact.title1' | translate }}
                <span class="bg-gradient-to-r from-regal-purple to-cyber-cyan bg-clip-text text-transparent">
                    {{ 'contact.title2' | translate }}
                </span>
            </h2>
            <p class="text-text-dim text-sm md:text-base max-w-lg mx-auto leading-relaxed">
                {{ 'contact.subtitle' | translate }}
            </p>
        </div>

        <!-- كارت الفورم الشفاف الـ Glassmorphism -->
        <div
            class="bg-surface/30 backdrop-blur-md border border-regal-purple/10 p-6 md:p-10 rounded-2xl max-w-2xl mx-auto shadow-2xl">

            @if (isSubmitted) {
            <!-- رسالة نجاح الإرسال بأنيميشن نيون أخضر خفيف -->
            <div
                class="p-4 mb-6 bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 rounded-xl text-center text-sm md:text-base animate-pulse">
                ✨ {{ 'contact.success_msg' | translate }}
            </div>
            }

            <form (ngSubmit)="onSubmit()" #contactForm="ngForm" class="space-y-6">

                <!-- حقل الاسم -->
                <div>
                    <label class="block text-sm font-medium text-text-main mb-2 text-left rtl:text-right">
                        {{ 'contact.name_label' | translate }}
                    </label>
                    <input type="text" name="name" [(ngModel)]="formData.name" required #nameInput="ngModel"
                        class="w-full bg-surface/50 border border-regal-purple/20 rounded-xl px-4 py-3 text-text-main text-sm focus:outline-none focus:border-cyber-cyan focus:shadow-[0_0_15px_rgba(0,209,255,0.2)] transition-all text-left rtl:text-right"
                        [class.border-red-500]="nameInput.invalid && nameInput.touched">
                </div>

                <!-- حقل البريد الإلكتروني -->
                <div>
                    <label class="block text-sm font-medium text-text-main mb-2 text-left rtl:text-right">
                        {{ 'contact.email_label' | translate }}
                    </label>
                    <input type="email" name="email" [(ngModel)]="formData.email" required email #emailInput="ngModel"
                        class="w-full bg-surface/50 border border-regal-purple/20 rounded-xl px-4 py-3 text-text-main text-sm focus:outline-none focus:border-cyber-cyan focus:shadow-[0_0_15px_rgba(0,209,255,0.2)] transition-all text-left rtl:text-right"
                        [class.border-red-500]="emailInput.invalid && emailInput.touched">
                </div>

                <!-- حقل نص الرسالة -->
                <div>
                    <label class="block text-sm font-medium text-text-main mb-2 text-left rtl:text-right">
                        {{ 'contact.msg_label' | translate }}
                    </label>
                    <textarea name="message" [(ngModel)]="formData.message" required rows="5" #msgInput="ngModel"
                        class="w-full bg-surface/50 border border-regal-purple/20 rounded-xl px-4 py-3 text-text-main text-sm focus:outline-none focus:border-cyber-cyan focus:shadow-[0_0_15px_rgba(0,209,255,0.2)] transition-all resize-none text-left rtl:text-right"
                        [class.border-red-500]="msgInput.invalid && msgInput.touched"></textarea>
                </div>

                <!-- زرار الإرسال بتأثير نيون متوهج عند الـ Hover -->
                <button type="submit" [disabled]="contactForm.invalid"
                    class="w-full py-3.5 px-6 rounded-xl font-bold text-sm text-white bg-gradient-to-r from-regal-purple to-cyber-cyan opacity-90 hover:opacity-100 shadow-[0_4px_20px_rgba(139,92,246,0.3)] hover:shadow-[0_4px_25px_rgba(0,209,255,0.4)] disabled:opacity-40 disabled:cursor-not-allowed disabled:shadow-none transition-all duration-300">
                    {{ 'contact.send_btn' | translate }}
                </button>

            </form>
        </div>

        <!-- ================= الـ Footer ================= -->
        <footer
            class="mt-24 pt-8 border-t border-regal-purple/5 flex flex-col md:flex-row items-center justify-between gap-6">

            <!-- اللوجو أو الاسم الخاص بيكِ -->
            <div
                class="text-xl font-black bg-gradient-to-r from-regal-purple to-cyber-cyan bg-clip-text text-transparent tracking-wider">
                RANIA.DEV
            </div>

            <!-- حقوق الحفظ والتأليف -->
            <p class="text-text-dim text-xs md:text-sm order-3 md:order-2">
                {{ 'contact.rights' | translate }}
            </p>

            <!-- روابط السوشيال ميديا ومنصات العمل الحر -->
            <div class="flex items-center gap-5 order-2 md:order-3">
                <!-- لينك مستقل -->
                <a href="https://mostaql.com/u/RaniaMaNsour/portfolio" target="_blank"
                    class="text-text-dim hover:text-cyber-cyan transition-colors text-sm font-medium">
                    مستقل
                </a>
                <!-- لينك جيت هاب -->
                <a href="https://github.com/rania-ibrhem30" target="_blank"
                    class="text-text-dim hover:text-regal-purple transition-colors text-sm font-medium">
                    GitHub
                </a>
                <!-- لينك لينكد إن -->
                <a href="https://www.linkedin.com/in/rania-ibrahem-ba54a6396/" target="_blank"
                    class="text-text-dim hover:text-cyber-cyan transition-colors text-sm font-medium">
                    LinkedIn
                </a>
            </div>

        </footer>

    </div>
</section>

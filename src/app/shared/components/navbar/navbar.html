<nav
    class="w-[90%] mx-auto mt-6 px-6 md:px-8 py-4 flex items-center justify-between rounded-[24px] md:rounded-[28px] border border-regal-purple/20 bg-surface/70 backdrop-blur-xl shadow-[0_0_35px_rgba(200,0,255,0.15)] transition-colors duration-500 relative z-50">

    <div
        class="text-2xl md:text-3xl font-bold bg-gradient-to-r from-regal-purple to-cyber-cyan bg-clip-text text-transparent cursor-pointer">
        {{'nav.name' | translate}}
    </div>

    <ul class="hidden md:flex items-center gap-10">
        @for (link of ['about', 'skills', 'experience', 'projects', 'contact']; track link) {
        <li>
            <button (click)="navigateToSection(link)" class="relative text-text-dim hover:text-text-main duration-300 
                       after:absolute after:left-0 after:-bottom-2 after:w-0 after:h-[2px] 
                       after:bg-gradient-to-r after:from-regal-purple after:to-cyber-cyan 
                       after:duration-300 hover:after:w-full bg-transparent border-none cursor-pointer text-base">
                {{ 'nav.' + link | translate }}
            </button>
        </li>
        }
    </ul>

    <div class="flex items-center gap-2 md:gap-4">
        <div class="hidden md:flex items-center gap-4">
            <button (click)="toggleLanguage()"
                class="px-4 py-2 rounded-full border border-regal-purple/30 text-text-dim hover:text-text-main hover:border-regal-purple duration-300 text-sm">
                {{ 'nav.lang_btn' | translate }}
            </button>

            <button (click)="toggleDarkMode()"
                class="w-10 h-10 rounded-full flex items-center justify-center bg-gradient-to-r from-regal-purple to-cyber-cyan text-white shadow-[0_0_20px_rgba(200,0,255,0.4)] hover:scale-110 duration-300">
                @if (isDarkMode()) { <span class="text-lg cursor-pointer">☀️</span> }
                @else { <span class="text-lg cursor-pointer">🌙</span> }
            </button>
        </div>

        <button (click)="toggleMenu()"
            class="flex md:hidden flex-col justify-center items-center w-10 h-10 border border-regal-purple/20 bg-surface/50 rounded-xl gap-1.5 focus:outline-none z-50">
            <span class="h-0.5 w-5 bg-cyber-cyan rounded-full transition-transform duration-300"
                [class.rotate-45]="isMenuOpen()" [class.translate-y-2]="isMenuOpen()"></span>
            <span class="h-0.5 w-5 bg-cyber-cyan rounded-full transition-opacity duration-300"
                [class.opacity-0]="isMenuOpen()"></span>
            <span class="h-0.5 w-5 bg-cyber-cyan rounded-full transition-transform duration-300"
                [class.-rotate-45]="isMenuOpen()" [class.-translate-y-2]="isMenuOpen()"></span>
        </button>
    </div>

    @if (isMenuOpen()) {
    <div
        class="absolute top-[110%] left-0 w-full md:hidden bg-surface/95 border border-regal-purple/20 rounded-2xl p-6 backdrop-blur-2xl shadow-[0_20px_40px_rgba(200,0,255,0.2)] flex flex-col gap-6 animate-[fadeIn_0.2s_ease-out]">

        <ul class="flex flex-col gap-5 text-center">
            @for (link of ['about', 'experience', 'projects', 'contact']; track link) {
            <li>
                <button (click)="navigateToSection(link)"
                    class="block w-full text-text-dim hover:text-cyber-cyan text-lg py-1 duration-300 bg-transparent border-none cursor-pointer text-center">
                    {{ 'nav.' + link | translate }}
                </button>
            </li>
            }
        </ul>

        <div class="h-[1px] bg-regal-purple/10 w-full"></div>

        <div class="flex items-center justify-between gap-4">
            <button (click)="toggleLanguage()"
                class="flex-1 py-2.5 rounded-xl border border-cyber-cyan/30 bg-cyber-cyan/5 text-cyber-cyan font-bold text-sm">
                {{ 'nav.lang_btn' | translate }}
            </button>

            <button (click)="toggleDarkMode()"
                class="w-12 h-12 rounded-xl flex items-center justify-center bg-gradient-to-r from-regal-purple to-cyber-cyan text-white shadow-[0_0_15px_rgba(200,0,255,0.3)]">
                @if (isDarkMode()) { <span class="text-xl">☀️</span> }
                @else { <span class="text-xl">🌙</span> }
            </button>
        </div>
    </div>
    }
</nav>
